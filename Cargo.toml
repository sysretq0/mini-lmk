[package]
name = "mini-lmk"
version = "1.1.0"
edition = "2021"
description = "Rootless event-driven userspace memory manager for Android 10+ (API 29+)"
license = "GPL-3.0-only"


[dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = false
