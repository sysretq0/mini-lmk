name: Build & Package AxManager Plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build Multi-ABI AxManager Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Setup Android NDK (Latest Stable r30)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30
          add-to-path: true

      - name: Add NDK Toolchain to PATH
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Run Test Suite
        run: cargo test --verbose

      - name: Build All Android ABIs
        run: |
          echo "=== Building aarch64-linux-android (arm64-v8a) ==="
          cargo build --release --target aarch64-linux-android

          echo "=== Building armv7-linux-androideabi (armeabi-v7a) ==="
          cargo build --release --target armv7-linux-androideabi

          echo "=== Building x86_64-linux-android (x86_64) ==="
          cargo build --release --target x86_64-linux-android

          echo "=== Building i686-linux-android (x86) ==="
          cargo build --release --target i686-linux-android

      - name: Package AxManager Plugin Zip
        run: |
          chmod +x package.sh
          ./package.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-lmk-axmanager
          path: dist/*.zip
          if-no-files-found: error

      - name: Generate Release Notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        id: release-notes
        run: |
          python3 -c "
          import os, re
          tag = os.environ.get('GITHUB_REF_NAME', '')
          ver = tag.lstrip('v')
          repo = os.environ.get('GITHUB_REPOSITORY', '')

          notes = ''
          if os.path.exists('CHANGELOG.md'):
              with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              pattern = rf'## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              m = re.search(pattern, content, re.DOTALL)
              if m:
                  notes = m.group(1).strip()

          changelog_link = f'https://github.com/{repo}/blob/{tag}/CHANGELOG.md'
          if notes:
              body = f'{notes}\n\n---\n**Full Changelog**: [{tag} Release Notes]({changelog_link})'
          else:
              body = f'See [CHANGELOG.md]({changelog_link}) for details and change history.'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('body<<EOF\n' + body + '\nEOF\n')
          "

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: ${{ steps.release-notes.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
