name: Build & Package AxManager Plugin

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build Multi-ABI AxManager Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Setup Android NDK (Latest Stable r30)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30
          add-to-path: true

      - name: Add NDK Toolchain to PATH
        run: |
          echo "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Run Test Suite
        run: cargo test --verbose

      - name: Build Spawn Probe Harness
        # tools/spawnprobe is excluded from the workspace, so nothing else in CI
        # compiles it. It is the only way to regenerate the tables in
        # docs/ROADMAP.md section 3, and a harness that has silently stopped
        # building turns a falsifiable claim back into an unfalsifiable one.
        run: cargo build --release --target aarch64-linux-android --manifest-path tools/spawnprobe/Cargo.toml

      - name: Build All Android ABIs
        run: |
          echo "=== Building aarch64-linux-android (arm64-v8a) ==="
          cargo build --release --target aarch64-linux-android

          echo "=== Building armv7-linux-androideabi (armeabi-v7a) ==="
          cargo build --release --target armv7-linux-androideabi

          echo "=== Building x86_64-linux-android (x86_64) ==="
          cargo build --release --target x86_64-linux-android

          echo "=== Building i686-linux-android (x86) ==="
          cargo build --release --target i686-linux-android

      - name: Package AxManager Plugin Zip
        run: |
          chmod +x package.sh
          ./package.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-lmk-axmanager
          path: dist/*.zip
          if-no-files-found: error

      - name: Generate Release Notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        id: release-notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          CHANGELOG_LINK="https://github.com/${REPO}/blob/${TAG}/CHANGELOG.md"
          NOTES=$(awk -v ver="## [${TAG#v}]" 'index($0, ver) == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')
          if [ -n "$NOTES" ]; then
            BODY="${NOTES}"$'\n\n---\n'"**Full Changelog**: [${TAG} Release Notes](${CHANGELOG_LINK})"
          else
            BODY="See [CHANGELOG.md](${CHANGELOG_LINK}) for details and change history."
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: ${{ steps.release-notes.outputs.body }}
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
