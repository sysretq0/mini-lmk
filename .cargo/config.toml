# .cargo/config.toml (Committed to Git - Environment & CI Agnostic)
# Linker resolution delegates to $PATH or CARGO_TARGET_<TARGET>_LINKER overrides.

[target.aarch64-linux-android]
linker = "aarch64-linux-android29-clang"
rustflags = [
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--exclude-libs,ALL",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,--as-needed",
]

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi29-clang"
rustflags = [
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--exclude-libs,ALL",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,--as-needed",
]

[target.i686-linux-android]
linker = "i686-linux-android29-clang"
rustflags = [
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--exclude-libs,ALL",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,--as-needed",
]

[target.x86_64-linux-android]
linker = "x86_64-linux-android29-clang"
rustflags = [
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--exclude-libs,ALL",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,--as-needed",
]
