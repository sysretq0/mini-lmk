[build]
target = "aarch64-linux-android"

[target.aarch64-linux-android]
linker = "/opt/ndk/toolchains/llvm/prebuilt/linux-arm64/bin/aarch64-linux-android29-clang"
rustflags = [
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--exclude-libs,ALL",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,--as-needed",
]

[target.armv7-linux-androideabi]
linker = "/opt/ndk/toolchains/llvm/prebuilt/linux-arm64/bin/armv7a-linux-androideabi29-clang"
rustflags = [
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--exclude-libs,ALL",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,--as-needed",
]

[target.i686-linux-android]
linker = "/opt/ndk/toolchains/llvm/prebuilt/linux-arm64/bin/i686-linux-android29-clang"
rustflags = [
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--exclude-libs,ALL",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,--as-needed",
]

[target.x86_64-linux-android]
linker = "/opt/ndk/toolchains/llvm/prebuilt/linux-arm64/bin/x86_64-linux-android29-clang"
rustflags = [
    "-C", "link-arg=-Wl,--gc-sections",
    "-C", "link-arg=-Wl,--exclude-libs,ALL",
    "-C", "link-arg=-Wl,-z,relro,-z,now",
    "-C", "link-arg=-Wl,--as-needed",
]
